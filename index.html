<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Button Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #number {
            font-size: 48px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button onclick="showOne()">Press me</button>
    <div id="number"></div>

    <script>
        function showOne() {
            document.getElementById("number").innerText = "1";
        }
    </script>

</body>
</html>
